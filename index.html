    --bg-card: #fdfbf6;
    --bg-soft: #ebe6dc;
    --ink: #1a1814;
    --ink-soft: #5c574e;
    --ink-faint: #8a8478;
    --accent: #8b3a3a;
    --accent-soft: #f2e0d5;
    --ok: #4a6b3e;
    --ok-soft: #dde6d4;
    --err: #b34747;
    --err-soft: #f5dcdc;
    --hint: #4a6b8a;
    --hint-soft: #dce5ef;
    --border: rgba(26, 24, 20, 0.12);
    --border-strong: rgba(26, 24, 20, 0.25);
    --serif: 'Cormorant Garamond', 'Source Han Serif SC', 'Songti SC', Georgia, serif;
    --sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;

  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; padding: 0; }
  input { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; width: 100%; outline: none; transition: border-color .15s; }
  input:focus { border-color: var(--ink-soft); }
  textarea { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; width: 100%; min-height: 82px; resize: vertical; outline: none; line-height: 1.45; }

  .tab { flex-shrink: 0; padding: 7px 12px; font-size: 12px; font-weight: 500; color: var(--ink-soft); border-radius: 14px; border: 1px solid transparent; white-space: nowrap; transition: all .15s; }

  .tab:not(.active):hover { background: var(--bg-soft); }

  .topic-row { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .topic-row::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 4px 10px; font-size: 11px; color: var(--ink-soft); border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); white-space: nowrap; }

  .progress-fill { height: 100%; background: var(--accent); transition: width .3s ease; }

  .ru-mid { font-family: var(--cyr); font-size: 22px; font-weight: 500; }
  .pos { font-size: 11px; color: var(--ink-faint); font-style: italic; }
  .cn { font-size: 17px; }

  .icon-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; font-size: 11px; color: var(--ink-soft); background: var(--bg-soft); border-radius: 6px; transition: background .12s; }
  .icon-btn:hover { background: var(--border); }
  .icon-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

  .example { background: var(--bg-soft); border-radius: 8px; padding: 11px 12px; margin: 12px 0 10px; }
  .example .ru-ex { font-family: var(--cyr); font-size: 15px; margin: 0 0 4px; }
  .example .cn-ex { font-size: 12px; color: var(--ink-soft); margin: 0; }

  .note { background: var(--hint-soft); color: var(--hint); border-radius: 8px; padding: 8px 11px; font-size: 12px; line-height: 1.5; }

  .nav-btn.danger { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .nav-btn.accent { background: var(--accent); color: var(--bg-card); border-color: transparent; }

  .flashcard { min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; user-select: none; }

  .opt { display: block; width: 100%; text-align: left; padding: 11px 13px; font-size: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; transition: all .12s; }
  .opt:hover:not(:disabled) { border-color: var(--ink-soft); background: var(--bg-soft); }
  .opt.correct { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .opt.wrong { background: var(--err-soft); border-color: var(--err); color: var(--err); }

  .kbd-key { flex: 1; max-width: 34px; min-width: 0; padding: 10px 0; font-family: var(--cyr); font-size: 15px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; transition: background .08s; }

  .feedback { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .feedback.err { background: var(--err-soft); color: var(--err); }

  .small-btn { padding: 5px 8px; font-size: 11px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; flex-shrink: 0; }

  .daily-box { background: var(--bg-soft); border-radius: 8px; padding: 10px; min-height: 70px; }
  .daily-box strong { display: block; font-family: var(--serif); font-size: 26px; line-height: 1; font-weight: 500; margin-bottom: 5px; }
  .daily-box span { display: block; font-size: 11px; color: var(--ink-soft); line-height: 1.35; }
  .review-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .review-meta span { padding: 3px 7px; border-radius: 8px; background: var(--bg-soft); color: var(--ink-soft); font-size: 10px; }
  .dict-tools { display: grid; grid-template-columns: 1fr 118px; gap: 7px; margin-bottom: 10px; }
  .pack-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .pack-btn { text-align: left; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); }
  .pack-btn strong { display: block; font-size: 13px; margin-bottom: 2px; }
  .pack-btn span { display: block; font-size: 11px; color: var(--ink-soft); line-height: 1.35; }
  .pack-btn.active { border-color: var(--accent); background: var(--accent-soft); }

  .footer-stats { display: flex; justify-content: space-between; padding-top: 12px; margin-top: 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.05em; }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 14px; }

  @media (max-width: 380px) {
    .kbd-key { max-width: 28px; font-size: 13px; padding: 9px 0; }
    .ru-big { font-size: 28px; }
    .header h1 { font-size: 22px; }
    .dict-tools { grid-template-columns: 1fr; }
    .pack-grid { grid-template-columns: 1fr; }
  }
</style>

// ============ 状态 ============
const STORE_KEY = 'russian_vocab_v3';
const REVIEW_STEPS = [
  { label: '10分钟', ms: 10 * 60 * 1000 },
  { label: '1天', ms: 24 * 60 * 60 * 1000 },
  { label: '2天', ms: 2 * 24 * 60 * 60 * 1000 },
  { label: '4天', ms: 4 * 24 * 60 * 60 * 1000 },
  { label: '7天', ms: 7 * 24 * 60 * 60 * 1000 },
  { label: '15天', ms: 15 * 24 * 60 * 60 * 1000 },
  { label: '30天', ms: 30 * 24 * 60 * 60 * 1000 }
];
let state = {
  custom: [],
  known: [],
  selected: [],
  currentPack: 'all',
  review: {},
  daily: { newTarget: 12, reviewTarget: 35, date: '', newDone: 0, reviewDone: 0 },
  stats: { browse: 0, flashcard: 0, quiz: 0, spell: 0, cloze: 0, correctSpell: 0, totalSpell: 0, correctCloze: 0, totalCloze: 0 }
};
let mode = 'today';
let topic = '全部';
let idx = 0;
let flashRevealed = false;
let quizState = null;
let spellState = null;
let clozeState = null;
let shifted = false;
let sessionList = null;
let dictSearch = '';
let dictTopic = '全部';

function loadState() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if (s) {
      const data = JSON.parse(s);
      state.custom = data.custom || [];
      state.known = data.known || [];
      state.selected = data.selected || [];
      state.currentPack = data.currentPack || 'all';
      state.review = data.review || {};
      state.daily = Object.assign(state.daily, data.daily || {});
      state.stats = Object.assign(state.stats, data.stats || {});
    }
  } catch(e) {}
  migrateState();
  ensureDaily();
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}
function todayKey() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}
function migrateState() {
  const allIds = BUILTIN.map(w => w.id);
  if (!Array.isArray(state.selected) || state.selected.length === 0) {
    state.selected = allIds.slice();
  }
  const valid = new Set(allWords().map(w => w.id));
  state.selected = state.selected.filter((id, pos, arr) => valid.has(id) && arr.indexOf(id) === pos);
}
function ensureDaily() {
  const today = todayKey();
  if (state.daily.date !== today) {
    state.daily.date = today;
    state.daily.newDone = 0;
    state.daily.reviewDone = 0;
    saveState();
  }
}
function isKnown(id) { return state.known.indexOf(id) >= 0; }
function toggleKnown(id) {
  const i = state.known.indexOf(id);
  if (i >= 0) state.known.splice(i, 1); else state.known.push(id);
  if (i < 0) scheduleReview(id, true);
  saveState();
}
function markKnown(id) {
  if (state.known.indexOf(id) < 0) { state.known.push(id); saveState(); }
}
function allWords() { return BUILTIN.concat(state.custom); }
function activeWords() {
  return allWords().filter(w => state.selected.indexOf(w.id) >= 0);
}
function isSelected(id) {
  return state.selected.indexOf(id) >= 0;
}
function toggleSelected(id) {
  const i = state.selected.indexOf(id);
  if (i >= 0) state.selected.splice(i, 1); else state.selected.push(id);
  saveState();
}
function packWords(pack) {
  const words = allWords();
  if (!pack || pack.id === 'all') return words;
  if (pack.road) return words.filter(w => w.roadPack || w.topic === '走遍俄罗斯1范围');
  if (pack.imported) return words.filter(w => w.imported || String(w.id).charAt(0) === 'i');
  return words.filter(w => pack.topics.indexOf(w.topic) >= 0);
}
function applyPack(packId) {
  const pack = DICT_PACKS.find(p => p.id === packId) || DICT_PACKS[0];
  const ids = packWords(pack).map(w => w.id);
  if (ids.length === 0) return 0;
  state.selected = ids;
  state.currentPack = pack.id;
  saveState();
  return ids.length;
}
function normalizeHeader(name) {
  const key = String(name || '').trim().toLowerCase();
  const map = {
    russian: 'ru', word: 'ru', term: 'ru', ru: 'ru', слово: 'ru',
    stress: 'stress', stressed: 'stress', accent: 'stress',
    chinese: 'cn', meaning: 'cn', translation: 'cn', cn: 'cn', zh: 'cn', 中文: 'cn',
    topic: 'topic', category: 'topic', tag: 'topic', 主题: 'topic',
    pos: 'pos', part: 'pos', type: 'pos', 词性: 'pos',
    example: 'example', sentence: 'example', 例句: 'example',
    examplecn: 'exampleCn', example_cn: 'exampleCn', sentencecn: 'exampleCn', 例句中文: 'exampleCn',
    note: 'note', notes: 'note', 备注: 'note'
  };
  return map[key] || key;
}
function splitDelimitedLine(line, sep) {
  const out = [];
  let cur = '';
  let quote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (quote && line[i + 1] === '"') { cur += '"'; i++; }
      else quote = !quote;
    } else if (ch === sep && !quote) {
      out.push(cur.trim());
      cur = '';
    } else cur += ch;
  }
  out.push(cur.trim());
  return out;
}
function parseDelimited(text) {
  const lines = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if (lines.length === 0) return [];
  const sep = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
  const headers = splitDelimitedLine(lines[0], sep).map(normalizeHeader);
  return lines.slice(1).map(line => {
    const cells = splitDelimitedLine(line, sep);
    const row = {};
    headers.forEach((h, i) => row[h] = cells[i] || '');
    return row;
  });
}
function parseImportText(text) {
  const raw = text.trim();
  if (!raw) return [];
  if (raw[0] === '[' || raw[0] === '{') {
    const data = JSON.parse(raw);
    if (Array.isArray(data)) return data;
    if (Array.isArray(data.words)) return data.words;
    if (Array.isArray(data.items)) return data.items;
    return [data];
  }
  return parseDelimited(raw);
}
function normalizeImportUrl(url) {
  let u = String(url || '').trim();
  if (!u) return '';
  u = u.replace('https://github.com/', 'https://raw.githubusercontent.com/');
  u = u.replace('/blob/', '/');
  return u;
}
function importWordsFromText(text, sourceName) {
  const rows = parseImportText(text);
  const existing = new Set(allWords().map(w => `${String(w.ru).toLowerCase()}|${String(w.cn).toLowerCase()}`));
  let added = 0;
  rows.forEach((row, i) => {
    const ru = String(row.ru || row.russian || row.word || '').trim();
    const cn = String(row.cn || row.zh || row.chinese || row.meaning || row.translation || '').trim();
    if (!ru || !cn) return;
    const key = `${ru.toLowerCase()}|${cn.toLowerCase()}`;
    if (existing.has(key)) return;
    existing.add(key);
    const id = 'i' + Date.now() + '_' + i;
    state.custom.push({
      id,
      topic: String(row.topic || row.category || '导入').trim() || '导入',
      ru,
      stress: String(row.stress || row.accent || '').trim() || ru,
      cn,
      pos: String(row.pos || row.type || '').trim() || '导入词',
      example: String(row.example || row.sentence || '').trim(),
      exampleCn: String(row.exampleCn || row.example_cn || row.sentenceCn || '').trim(),
      target: ru,
      note: String(row.note || row.notes || sourceName || '导入词典').trim(),
      custom: true,
      imported: true
    });
    state.selected.push(id);
    added += 1;
  });
  state.selected = state.selected.filter((id, pos, arr) => arr.indexOf(id) === pos);
  saveState();
  return added;
}
function scheduleReview(id, ok) {
  ensureDaily();
  const now = Date.now();
  const current = state.review[id] || { stage: 0, due: now, seen: 0, correct: 0, wrong: 0, last: 0 };
  const wasNew = current.seen === 0;
  const wasDue = current.seen > 0 && current.due <= now;
  current.seen += 1;
  current.last = now;
  if (ok) {
    current.correct += 1;
    current.stage = Math.min((current.stage || 0) + 1, REVIEW_STEPS.length - 1);
  } else {
    current.wrong += 1;
    current.stage = 0;
    const k = state.known.indexOf(id);
    if (k >= 0) state.known.splice(k, 1);
  }
  current.due = now + REVIEW_STEPS[current.stage].ms;
  state.review[id] = current;
  if (wasNew && state.daily.newDone < state.daily.newTarget) state.daily.newDone += 1;
  else if (wasDue && state.daily.reviewDone < state.daily.reviewTarget) state.daily.reviewDone += 1;
}
function reviewInfo(id) {
  return state.review[id] || null;
}
function dueWords() {
  const now = Date.now();
  return activeWords().filter(w => state.review[w.id] && state.review[w.id].due <= now);
}
function newWords() {
  return activeWords().filter(w => !state.review[w.id]);
}
function buildTodayList() {
  ensureDaily();
  const reviews = dueWords().slice(0, Math.max(0, state.daily.reviewTarget - state.daily.reviewDone));
  const fresh = newWords().slice(0, Math.max(0, state.daily.newTarget - state.daily.newDone));
  return reviews.concat(fresh);
}

function getList() {
  if (sessionList) return sessionList;
  const all = activeWords();
  if (topic === '全部') return all;
  if (topic === '我添加的') return state.custom;
  return all.filter(w => w.topic === topic);
}

// ============ 发音 ============
function speak(text, rate) {
  if (!('speechSynthesis' in window)) {
    alert('当前浏览器不支持语音合成');
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = rate || 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function updateFooter() {
  const list = getList();
  if (list.length === 0) {
    $('progressFill').style.width = '0%';
    $('wordCounter').textContent = '0 / 0';
  } else {
    $('progressFill').style.width = ((idx + 1) / list.length * 100) + '%';
    $('wordCounter').textContent = (idx + 1) + ' / ' + list.length;
  }
  $('knownCounter').textContent = activeWords().filter(w => isKnown(w.id)).length;
}

function empty(msg) {
  return `<div class="card"><div class="empty">${msg}</div></div>`;
}
function advanceAfterPractice(list) {
  if (sessionList && idx >= list.length - 1) {
    sessionList = null;
    idx = 0;
    mode = 'today';
    render();
    return;
  }
  idx = (idx + 1) % list.length;
  render();
}
function reviewMeta(w) {
  const r = reviewInfo(w.id);
  if (!r) return '<div class="review-meta"><span>未学习</span><span>加入今日新词后开始排程</span></div>';
  const due = r.due <= Date.now() ? '现在该复习' : '下次 ' + new Date(r.due).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
  const step = REVIEW_STEPS[Math.min(r.stage, REVIEW_STEPS.length - 1)].label;
  return `<div class="review-meta"><span>第 ${r.stage + 1} 阶</span><span>${due}</span><span>间隔 ${step}</span><span>对 ${r.correct || 0} / 错 ${r.wrong || 0}</span></div>`;
}

    $('dictText').value = 'ru,stress,cn,topic,pos,example,exampleCn,note\\nкнига,кни́га,书,学习,阴性名词,Это новая книга.,这是一本新书。,示例\\nговорить,говори́ть,说,动词,动词,Я говорю по-русски.,我说俄语。,示例';
  };
  $('importDict').onclick = () => {
    const msg = $('importMsg');
    const url = normalizeImportUrl($('dictUrl').value);
    const file = $('dictFile').files && $('dictFile').files[0];
    const apply = (text, source) => {
      try {
        const added = importWordsFromText(text, source);
        if (added > 0) applyPack('imported');
        msg.style.color = added > 0 ? 'var(--ok)' : 'var(--ink-soft)';
        msg.textContent = added > 0 ? `已导入 ${added} 个词，并自动加入学习。` : '没有导入新词，可能是格式不对或词已存在。';
        dictTopic = '我添加的';
        dictSearch = '';
        render();
      } catch (e) {
        msg.style.color = 'var(--err)';
        msg.textContent = '导入失败：请检查 JSON/CSV/TSV 格式。';
      }
    };
    if (url) {
      msg.style.color = 'var(--ink-soft)';
      msg.textContent = '正在从线上词典读取...';
      fetch(url).then(res => {
        if (!res.ok) throw new Error('fetch failed');
        return res.text();
      }).then(text => apply(text, url)).catch(() => {
        msg.style.color = 'var(--err)';
        msg.textContent = '线上导入失败：链接可能不是 raw 文件，或网站不允许跨域读取。';
      });
    } else if (file) {
      const reader = new FileReader();
      reader.onload = () => apply(String(reader.result || ''), file.name);
      reader.onerror = () => { msg.style.color = 'var(--err)'; msg.textContent = '文件读取失败。'; };
      reader.readAsText(file);
    } else {
      apply($('dictText').value, '粘贴导入');
    }
  };
}

function renderFlashcard() {
  const list = getList();
  if (list.length === 0) { $('content').innerHTML = empty('这个分类还没有单词'); return; }
  if (idx >= list.length) idx = 0;
  const w = list[idx];

  $('content').innerHTML = `

      ${flashRevealed ? `
        <p class="ru-mid" style="margin:0 0 4px;">${w.stress}</p>
        <p class="pos" style="margin:0 0 14px;">${w.pos}</p>

        <p style="font-size:12px;color:var(--ink-faint);margin:0;">点击卡片查看释义</p>
      `}

      <button class="nav-btn danger" id="forgot">${ICON.x} 不认识</button>
      <button class="nav-btn success" id="got">${ICON.check} 认识</button>
    </div>` : ''}

    if (e.target.closest('#speakFlash')) return;
    if (!flashRevealed) { flashRevealed = true; speak(w.ru); render(); }
  };
  if (flashRevealed) {
    $('speakFlash').onclick = (e) => { e.stopPropagation(); speak(w.ru); };
    $('got').onclick = () => {
      markKnown(w.id);
      scheduleReview(w.id, true);
      state.stats.flashcard++;
      saveState();
      flashRevealed = false;
      advanceAfterPractice(list);
    };
    $('forgot').onclick = () => {
      const i = state.known.indexOf(w.id);
      if (i >= 0) state.known.splice(i, 1);
      scheduleReview(w.id, false);
      state.stats.flashcard++;
      saveState();
      flashRevealed = false;
      advanceAfterPractice(list);

// ---- 选择题 ----
function renderQuiz() {
  const list = getList();
  if (list.length < 4) { $('content').innerHTML = empty('选择题需要至少 4 个单词'); return; }
  if (idx >= list.length) idx = 0;
  if (!quizState) {
    const correct = list[idx];
    const others = list.filter(x => x.id !== correct.id).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = others.concat([correct]).sort(() => Math.random() - 0.5);
    quizState = { correct, options, answered: null };
  }
  const { correct, options, answered } = quizState;

  $('content').innerHTML = `
    <div class="card">
      <p style="font-size:11px;color:var(--ink-faint);margin:0 0 6px;letter-spacing:0.05em;">这个词什么意思？</p>
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px;">
        <span class="ru-mid" style="font-size:28px;">${correct.stress}</span>
        <button class="icon-btn" id="qSpeak">${ICON.volume}</button>
      </div>
      ${options.map((opt, i) => {
        let cls = 'opt';
        if (answered !== null) {
          if (opt.id === correct.id) cls += ' correct';
          else if (i === answered) cls += ' wrong';
        }
        return `<button class="${cls}" data-i="${i}" ${answered !== null ? 'disabled' : ''}>${opt.cn}</button>`;
      }).join('')}
      ${answered !== null && correct.example ? `<div class="example" style="margin-top:10px;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <p class="ru-ex" style="font-weight:500;">${correct.example}</p>
          <button class="icon-btn" id="qSpeakEx">${ICON.volume}</button>
        </div>
        <p class="cn-ex">${correct.exampleCn || ''}</p>
      </div>` : ''}
      ${answered !== null ? `<button class="nav-btn accent" style="width:100%;margin-top:10px;" id="qNext">下一题 ${ICON.arrowRight}</button>` : ''}
    </div>
  `;

  $('qSpeak').onclick = () => speak(correct.ru);
  if (answered === null) {
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const i = parseInt(b.dataset.i);
      quizState.answered = i;
      state.stats.quiz++;
      if (options[i].id === correct.id) {
        markKnown(correct.id);
        scheduleReview(correct.id, true);
      } else {
        scheduleReview(correct.id, false);
      }
      saveState();
      render();
    });
  } else {
    if (correct.example) $('qSpeakEx').onclick = () => speak(correct.example);
    $('qNext').onclick = () => { quizState = null; advanceAfterPractice(list); };
  }
}

function bindKeyboard(onChar, onSpace, onBs) {
  document.querySelectorAll('.kbd-key[data-ch]').forEach(b => b.onclick = () => {
    const ch = shifted ? b.dataset.ch.toUpperCase() : b.dataset.ch;
    onChar(ch);
  });
  $('kShift').onclick = () => { shifted = !shifted; render(); };
  $('kSpace').onclick = onSpace;
  $('kBs').onclick = onBs;
}

// ---- 统计 ----
function renderStats() {
  const total = activeWords().length;
  const knownInActive = activeWords().filter(w => isKnown(w.id)).length;
  const knownPct = total > 0 ? Math.round(knownInActive / total * 100) : 0;
  const totalActions = state.stats.browse + state.stats.flashcard + state.stats.quiz + state.stats.spell + state.stats.cloze;
  const spellAcc = state.stats.totalSpell > 0 ? Math.round(state.stats.correctSpell / state.stats.totalSpell * 100) : 0;
  const clozeAcc = state.stats.totalCloze > 0 ? Math.round(state.stats.correctCloze / state.stats.totalCloze * 100) : 0;
  const topicStats = TOPICS.slice(1).map(t => {
    const inTopic = activeWords().filter(w => w.topic === t);
    const knownInTopic = inTopic.filter(w => isKnown(w.id)).length;
    return { topic: t, total: inTopic.length, known: knownInTopic };
  });
  const activeIds = new Set(activeWords().map(w => w.id));
  const learned = Object.keys(state.review).filter(id => activeIds.has(id)).length;
  const due = dueWords().length;

  $('content').innerHTML = `
    <div class="stat-grid">

      <div class="stat-card"><p class="stat-label">拼写正确率</p><p class="stat-value">${spellAcc}<span style="font-size:14px;">%</span> <span class="stat-sub">${state.stats.correctSpell}/${state.stats.totalSpell}</span></p></div>
      <div class="stat-card"><p class="stat-label">填空正确率</p><p class="stat-value">${clozeAcc}<span style="font-size:14px;">%</span> <span class="stat-sub">${state.stats.correctCloze}/${state.stats.totalCloze}</span></p></div>
      <div class="stat-card"><p class="stat-label">已进入排程</p><p class="stat-value">${learned}</p></div>
      <div class="stat-card"><p class="stat-label">待复习</p><p class="stat-value">${due}</p></div>
    </div>

    <div class="card" style="margin-bottom:10px;">
      <p style="font-size:12px;font-weight:500;margin:0 0 12px;letter-spacing:0.05em;">各主题掌握进度</p>
      ${topicStats.map(s => `<div class="topic-bar">
        <div class="lbl"><span>${s.topic}</span><span>${s.known} / ${s.total}</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${s.total > 0 ? s.known / s.total * 100 : 0}%;"></div></div>
      </div>`).join('')}
    </div>

    <div class="card" style="margin-bottom:10px;">
      <p style="font-size:12px;font-weight:500;margin:0 0 10px;letter-spacing:0.05em;">练习次数（累计 ${totalActions}）</p>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;">
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.browse}</p><p class="stat-label" style="margin-top:2px;">浏览</p></div>
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.flashcard}</p><p class="stat-label" style="margin-top:2px;">认词</p></div>
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.quiz}</p><p class="stat-label" style="margin-top:2px;">选择</p></div>
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.spell}</p><p class="stat-label" style="margin-top:2px;">拼写</p></div>
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.cloze}</p><p class="stat-label" style="margin-top:2px;">填空</p></div>

      saveState();
      render();
    }
  };
}

    updateFooter();
  };
  $('clearBtn').onclick = () => {
    ['inRu','inStress','inCn','inPos','inEx','inExCn','inNote'].forEach(id => $(id).value = '');
    $('addMsg').textContent = '';
  };
}

// ---- 我的词 ----
function renderMyList() {
  if (state.custom.length === 0) {
    $('content').innerHTML = `<div class="card" style="text-align:center;padding:30px 20px;">
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px;">还没添加单词</p>
      <button class="nav-btn" id="gotoAdd" style="display:inline-block;padding:8px 16px;">＋ 去添加</button>
    </div>`;
    $('gotoAdd').onclick = () => switchMode('add');
    return;
  }
  $('content').innerHTML = `<div class="card">
    <p style="font-size:12px;color:var(--ink-soft);margin:0 0 10px;">共 ${state.custom.length} 个自定义</p>
    ${state.custom.map(w => `<div class="list-item">
      <div class="info">
        <p class="ru">${w.stress}</p>
        <p class="cn-small">${w.cn}</p>
      </div>
      <button class="small-btn" data-sp="${w.ru}">${ICON.volume}</button>
      <button class="small-btn danger" data-del="${w.id}">${ICON.trash}</button>
    </div>`).join('')}
  </div>`;
  document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => speak(b.dataset.sp));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    state.custom = state.custom.filter(x => x.id !== b.dataset.del);
    saveState();
    render();
  });
}

function render() {
  renderTabs();
  renderTopics();
  $('progressBar').style.display = ['today','dict','stats','add','mylist'].indexOf(mode) >= 0 ? 'none' : 'block';
  updateFooter();
  switch(mode) {
    case 'today': renderToday(); break;
    case 'dict': renderDict(); break;
    case 'browse': renderBrowse(); break;
    case 'flashcard': renderFlashcard(); break;
    case 'quiz': renderQuiz(); break;
    case 'spell': renderSpell(); break;
    case 'cloze': renderCloze(); break;
    case 'stats': renderStats(); break;
    case 'add': renderAdd(); break;
    case 'mylist': renderMyList(); break;
  }
}
function switchMode(m) {
  if (m !== 'flashcard' && m !== 'quiz' && m !== 'spell' && m !== 'cloze') sessionList = null;
  mode = m;
  flashRevealed = false;
  quizState = spellState = clozeState = null;
  shifted = false;
  render();
}

// 启动
loadState();
render();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
