  button, input { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; padding: 0; }
  input { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; width: 100%; outline: none; transition: border-color .15s; }
  input:focus { border-color: var(--ink-soft); }

  .app { max-width: 480px; margin: 0 auto; padding: 16px 14px 100px; min-height: 100vh; }
  .header { display: flex; align-items: baseline; gap: 10px; padding: 6px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }

  .header .sub { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500; }

  .mode-tabs { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .mode-tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 7px 12px; font-size: 12px; font-weight: 500; color: var(--ink-soft); border-radius: 14px; border: 1px solid transparent; white-space: nowrap; transition: all .15s; }

  .tab:not(.active):hover { background: var(--bg-soft); }

  .topic-row { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .topic-row::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 4px 10px; font-size: 11px; color: var(--ink-soft); border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); white-space: nowrap; }

  .progress { height: 2px; background: var(--bg-soft); border-radius: 1px; overflow: hidden; margin-bottom: 14px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .3s ease; }

  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 16px; box-shadow: 0 1px 0 rgba(0,0,0,0.02); }

  .badge { display: inline-block; padding: 2px 8px; font-size: 10px; background: var(--bg-soft); color: var(--ink-soft); border-radius: 10px; letter-spacing: 0.05em; }

  .ru-mid { font-family: var(--cyr); font-size: 22px; font-weight: 500; }
  .pos { font-size: 11px; color: var(--ink-faint); font-style: italic; }
  .cn { font-size: 17px; }

  .icon-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; font-size: 11px; color: var(--ink-soft); background: var(--bg-soft); border-radius: 6px; transition: background .12s; }
  .icon-btn:hover { background: var(--border); }
  .icon-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

  .example { background: var(--bg-soft); border-radius: 8px; padding: 11px 12px; margin: 12px 0 10px; }
  .example .ru-ex { font-family: var(--cyr); font-size: 15px; margin: 0 0 4px; }
  .example .cn-ex { font-size: 12px; color: var(--ink-soft); margin: 0; }

  .note { background: var(--hint-soft); color: var(--hint); border-radius: 8px; padding: 8px 11px; font-size: 12px; line-height: 1.5; }

  .nav-row { display: flex; gap: 6px; margin-top: 10px; }

  .nav-btn.accent { background: var(--accent); color: var(--bg-card); border-color: transparent; }

  .opt.wrong { background: var(--err-soft); border-color: var(--err); color: var(--err); }

  .input-display.err { border-color: var(--err); color: var(--err); }
  .input-display.empty { color: var(--ink-faint); font-family: var(--sans); font-size: 13px; letter-spacing: 0; }

  .kbd-key { flex: 1; max-width: 34px; min-width: 0; padding: 10px 0; font-family: var(--cyr); font-size: 15px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; transition: background .08s; }

  .kbd-fn.active { background: var(--accent); color: var(--bg-card); }

  .feedback { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .feedback.ok { background: var(--ok-soft); color: var(--ok); }
  .feedback.err { background: var(--err-soft); color: var(--err); }
  .feedback strong { font-family: var(--cyr); font-size: 16px; font-weight: 500; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .stat-label { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 4px; }
  .stat-value { font-family: var(--serif); font-size: 28px; font-weight: 500; margin: 0; line-height: 1; }
  .stat-sub { font-size: 11px; color: var(--ink-soft); }

  .bar-bg { height: 4px; background: var(--bg-soft); border-radius: 2px; overflow: hidden; }

  .form-row { margin-bottom: 9px; }

  .small-btn { padding: 5px 8px; font-size: 11px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; flex-shrink: 0; }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 14px; }

  @media (max-width: 380px) {
    .kbd-key { max-width: 28px; font-size: 13px; padding: 9px 0; }
    .ru-big { font-size: 28px; }
    .header h1 { font-size: 22px; }
  }
</style>

// ============ 状态 ============
const STORE_KEY = 'russian_vocab_v3';
let state = {
  custom: [],
  known: [],
  stats: { browse: 0, flashcard: 0, quiz: 0, spell: 0, cloze: 0, correctSpell: 0, totalSpell: 0, correctCloze: 0, totalCloze: 0 }
};
let mode = 'browse';
let topic = '全部';
let idx = 0;
let flashRevealed = false;
let quizState = null;
let spellState = null;
let clozeState = null;
let shifted = false;

function loadState() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if (s) {
      const data = JSON.parse(s);
      state.custom = data.custom || [];
      state.known = data.known || [];
      state.stats = Object.assign(state.stats, data.stats || {});
    }
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}
function isKnown(id) { return state.known.indexOf(id) >= 0; }
function toggleKnown(id) {
  const i = state.known.indexOf(id);
  if (i >= 0) state.known.splice(i, 1); else state.known.push(id);
  saveState();
}
function markKnown(id) {
  if (state.known.indexOf(id) < 0) { state.known.push(id); saveState(); }
}

function getList() {
  const all = BUILTIN.concat(state.custom);
  if (topic === '全部') return all;
  if (topic === '我添加的') return state.custom;
  return all.filter(w => w.topic === topic);
}

// ============ 发音 ============
function speak(text, rate) {
  if (!('speechSynthesis' in window)) {
    alert('当前浏览器不支持语音合成');
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = rate || 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

// ============ 渲染 ============
const $ = (id) => document.getElementById(id);

function renderTabs() {
  $('modeTabs').innerHTML = MODES.map(m =>
    `<button class="tab${mode === m.id ? ' active' : ''}" data-m="${m.id}">${m.name}</button>`
  ).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchMode(b.dataset.m));
}
function renderTopics() {
  const showTopics = ['browse', 'flashcard', 'quiz', 'spell', 'cloze'].indexOf(mode) >= 0;
  $('topicRow').style.display = showTopics ? 'flex' : 'none';
  if (!showTopics) return;
  const all = TOPICS.concat(['我添加的']);
  $('topicRow').innerHTML = all.map(t =>
    `<button class="chip${topic === t ? ' active' : ''}" data-t="${t}">${t}</button>`
  ).join('');
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    topic = b.dataset.t;
    idx = 0;
    quizState = spellState = clozeState = null;
    flashRevealed = false;
    render();
  });
}
function updateFooter() {
  const list = getList();
  if (list.length === 0) {
    $('progressFill').style.width = '0%';
    $('wordCounter').textContent = '0 / 0';
  } else {
    $('progressFill').style.width = ((idx + 1) / list.length * 100) + '%';
    $('wordCounter').textContent = (idx + 1) + ' / ' + list.length;
  }
  $('knownCounter').textContent = state.known.length;
}

function empty(msg) {
  return `<div class="card"><div class="empty">${msg}</div></div>`;
}

// ---- 浏览模式 ----
function renderBrowse() {
  const list = getList();
  if (list.length === 0) { $('content').innerHTML = empty('这个分类还没有单词'); return; }
  if (idx >= list.length) idx = 0;
  const w = list[idx];

  $('content').innerHTML = `
    <div class="card">
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <span class="badge">${w.topic}</span>
        ${w.custom ? '<span class="badge custom">自定义</span>' : ''}
      </div>
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;">
        <span class="ru-big">${w.stress}</span>
        <button class="icon-btn" id="speakWord">${ICON.volume}</button>
        <button class="icon-btn" id="speakSlow">慢速</button>
      </div>
      <p class="pos" style="margin:0 0 12px;">${w.pos}</p>
      <p class="cn" style="margin:0 0 4px;">${w.cn}</p>
      ${w.example ? `<div class="example">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <p class="ru-ex">${w.example}</p>
          <div style="display:flex;gap:4px;flex-shrink:0;">
            <button class="icon-btn" id="speakEx">${ICON.volume}</button>
            <button class="icon-btn" id="speakExSlow">慢</button>
          </div>
        </div>
        <p class="cn-ex">${w.exampleCn || ''}</p>
      </div>` : ''}
      ${w.note ? `<div class="note">${ICON.bulb} ${w.note}</div>` : ''}
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev">${ICON.arrowLeft}</button>
      <button class="nav-btn primary ${isKnown(w.id) ? 'success' : ''}" id="known">${ICON.check} ${isKnown(w.id) ? '已掌握' : '标记掌握'}</button>
      <button class="nav-btn" id="next">${ICON.arrowRight}</button>
    </div>
  `;

  $('speakWord').onclick = () => speak(w.ru);
  $('speakSlow').onclick = () => speak(w.ru, 0.55);
  if (w.example) {
    $('speakEx').onclick = () => speak(w.example);
    $('speakExSlow').onclick = () => speak(w.example, 0.55);
  }
  $('prev').onclick = () => { state.stats.browse++; saveState(); idx = (idx - 1 + list.length) % list.length; render(); };
  $('next').onclick = () => { state.stats.browse++; saveState(); idx = (idx + 1) % list.length; render(); };
  $('known').onclick = () => { toggleKnown(w.id); render(); };
}

// ---- 认词卡片 ----
function renderFlashcard() {
  const list = getList();
  if (list.length === 0) { $('content').innerHTML = empty('这个分类还没有单词'); return; }
  if (idx >= list.length) idx = 0;
  const w = list[idx];

  $('content').innerHTML = `
    <div class="card flashcard" id="flashcard">
      ${flashRevealed ? `
        <p class="ru-mid" style="margin:0 0 4px;">${w.stress}</p>
        <p class="pos" style="margin:0 0 14px;">${w.pos}</p>
        <p class="cn" style="margin:0 0 12px;">${w.cn}</p>
        ${w.example ? `<p style="font-family:var(--cyr);font-size:14px;color:var(--ink-soft);margin:0 0 14px;">${w.example}</p>` : ''}
        <button class="icon-btn" id="speakFlash">${ICON.volume} 听</button>
      ` : `
        <p class="ru-big" style="margin:0 0 14px;">${w.stress}</p>
        <p style="font-size:12px;color:var(--ink-faint);margin:0;">点击卡片查看释义</p>
      `}
    </div>
    ${flashRevealed ? `<div class="nav-row">
      <button class="nav-btn danger" id="forgot">${ICON.x} 不认识</button>
      <button class="nav-btn success" id="got">${ICON.check} 认识</button>
    </div>` : ''}
  `;

  $('flashcard').onclick = (e) => {
    if (e.target.closest('#speakFlash')) return;
    if (!flashRevealed) { flashRevealed = true; speak(w.ru); render(); }
  };
  if (flashRevealed) {
    $('speakFlash').onclick = (e) => { e.stopPropagation(); speak(w.ru); };
    $('got').onclick = () => {
      markKnown(w.id);
      state.stats.flashcard++;
      saveState();
      idx = (idx + 1) % list.length;
      flashRevealed = false;
      render();
    };
    $('forgot').onclick = () => {
      const i = state.known.indexOf(w.id);
      if (i >= 0) state.known.splice(i, 1);
      state.stats.flashcard++;
      saveState();
      idx = (idx + 1) % list.length;
      flashRevealed = false;
      render();
    };
  }
}

// ---- 选择题 ----
function renderQuiz() {
  const list = getList();
  if (list.length < 4) { $('content').innerHTML = empty('选择题需要至少 4 个单词'); return; }
  if (idx >= list.length) idx = 0;
  if (!quizState) {
    const correct = list[idx];
    const others = list.filter(x => x.id !== correct.id).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = others.concat([correct]).sort(() => Math.random() - 0.5);
    quizState = { correct, options, answered: null };
  }
  const { correct, options, answered } = quizState;

  $('content').innerHTML = `
    <div class="card">
      <p style="font-size:11px;color:var(--ink-faint);margin:0 0 6px;letter-spacing:0.05em;">这个词什么意思？</p>
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px;">
        <span class="ru-mid" style="font-size:28px;">${correct.stress}</span>
        <button class="icon-btn" id="qSpeak">${ICON.volume}</button>
      </div>
      ${options.map((opt, i) => {
        let cls = 'opt';
        if (answered !== null) {
          if (opt.id === correct.id) cls += ' correct';
          else if (i === answered) cls += ' wrong';
        }
        return `<button class="${cls}" data-i="${i}" ${answered !== null ? 'disabled' : ''}>${opt.cn}</button>`;
      }).join('')}
      ${answered !== null && correct.example ? `<div class="example" style="margin-top:10px;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <p class="ru-ex" style="font-weight:500;">${correct.example}</p>
          <button class="icon-btn" id="qSpeakEx">${ICON.volume}</button>
        </div>
        <p class="cn-ex">${correct.exampleCn || ''}</p>
      </div>` : ''}
      ${answered !== null ? `<button class="nav-btn accent" style="width:100%;margin-top:10px;" id="qNext">下一题 ${ICON.arrowRight}</button>` : ''}
    </div>
  `;

  $('qSpeak').onclick = () => speak(correct.ru);
  if (answered === null) {
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const i = parseInt(b.dataset.i);
      quizState.answered = i;
      state.stats.quiz++;
      if (options[i].id === correct.id) markKnown(correct.id);
      saveState();
      render();
    });
  } else {
    if (correct.example) $('qSpeakEx').onclick = () => speak(correct.example);
    $('qNext').onclick = () => { idx = (idx + 1) % list.length; quizState = null; render(); };
  }
}

// ---- 拼写 ----
function renderKeyboard(handler) {
  return `<div class="kbd">
    ${CYR_ROWS.map(row => `<div class="kbd-row">${row.map(ch =>
      `<button class="kbd-key" data-ch="${ch}">${shifted ? ch.toUpperCase() : ch}</button>`
    ).join('')}</div>`).join('')}
    <div class="kbd-row" style="margin-top:5px;">
      <button class="kbd-key kbd-fn ${shifted ? 'active' : ''}" id="kShift" style="flex:1;max-width:50px;">⇧</button>
      <button class="kbd-key kbd-fn" id="kSpace" style="flex:3;max-width:none;">空格</button>
      <button class="kbd-key kbd-fn" id="kBs" style="flex:1;max-width:50px;">${ICON.backspace}</button>
    </div>
  </div>`;
}

function bindKeyboard(onChar, onSpace, onBs) {
  document.querySelectorAll('.kbd-key[data-ch]').forEach(b => b.onclick = () => {
    const ch = shifted ? b.dataset.ch.toUpperCase() : b.dataset.ch;
    onChar(ch);
  });
  $('kShift').onclick = () => { shifted = !shifted; render(); };
  $('kSpace').onclick = onSpace;
  $('kBs').onclick = onBs;
}

function renderSpell() {
  const list = getList();
  if (list.length === 0) { $('content').innerHTML = empty('这个分类还没有单词'); return; }
  if (idx >= list.length) idx = 0;
  if (!spellState) spellState = { word: list[idx], input: '', checked: false };
  const w = spellState.word;
  const correct = w.ru.toLowerCase();
  const userInput = spellState.input.toLowerCase();
  const isOk = userInput === correct;

  $('content').innerHTML = `
    <div class="card">
      <p style="font-size:11px;color:var(--ink-faint);margin:0 0 4px;letter-spacing:0.05em;">把这个词拼出来</p>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
        <span style="font-size:20px;font-weight:500;">${w.cn}</span>
        <span class="pos">${w.pos}</span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:10px;">
        <button class="icon-btn" id="spSp">${ICON.volume} 听</button>
        <button class="icon-btn" id="spSpSlow">慢速</button>
      </div>
      <div class="input-display ${spellState.checked ? (isOk ? 'ok' : 'err') : ''} ${spellState.input ? '' : 'empty'}">
        ${spellState.input || '点字母拼写'}
      </div>
      ${spellState.checked ? `<div class="feedback ${isOk ? 'ok' : 'err'}">
        ${isOk ? `${ICON.check} 正确！` : `${ICON.x} 正确答案：<strong>${w.stress}</strong>`}
      </div>` : ''}
      ${renderKeyboard()}
      <div class="nav-row">
        ${!spellState.checked ? `<button class="nav-btn accent primary" id="spCheck">检查</button>` : ''}
        <button class="nav-btn" id="spNext">${spellState.checked ? '下一个 →' : '跳过'}</button>
      </div>
    </div>
  `;

  $('spSp').onclick = () => speak(w.ru);
  $('spSpSlow').onclick = () => speak(w.ru, 0.55);
  bindKeyboard(
    (ch) => { if (!spellState.checked) { spellState.input += ch; render(); } },
    () => { if (!spellState.checked) { spellState.input += ' '; render(); } },
    () => { if (!spellState.checked) { spellState.input = spellState.input.slice(0, -1); render(); } }
  );
  if (!spellState.checked) {
    $('spCheck').onclick = () => {
      spellState.checked = true;
      state.stats.spell++;
      state.stats.totalSpell++;
      if (isOk) { state.stats.correctSpell++; markKnown(w.id); }
      saveState();
      render();
    };
  }
  $('spNext').onclick = () => {
    idx = (idx + 1) % list.length;
    spellState = null;
    shifted = false;
    render();
  };
}

// ---- 填空 ----
function renderCloze() {
  const list = getList().filter(w => w.example && w.target);
  if (list.length === 0) { $('content').innerHTML = empty('这个分类暂无可填空的例句'); return; }
  if (idx >= list.length) idx = 0;
  if (!clozeState) clozeState = { word: list[idx], input: '', checked: false };
  const w = clozeState.word;
  const correct = w.target.toLowerCase();
  const userInput = clozeState.input.toLowerCase();
  const isOk = userInput === correct;
  const masked = w.example.replace(new RegExp(w.target, 'i'), '_____');

  $('content').innerHTML = `
    <div class="card">
      <p style="font-size:11px;color:var(--ink-faint);margin:0 0 6px;letter-spacing:0.05em;">补全句子里缺失的词</p>
      <p style="font-family:var(--cyr);font-size:19px;margin:0 0 6px;line-height:1.5;">${masked}</p>
      <p style="font-size:12px;color:var(--ink-soft);margin:0 0 10px;">${w.exampleCn || ''}</p>
      <div class="note" style="margin-bottom:10px;">${ICON.bulb} 提示：${w.cn}</div>
      <div class="input-display ${clozeState.checked ? (isOk ? 'ok' : 'err') : ''} ${clozeState.input ? '' : 'empty'}">
        ${clozeState.input || '点字母填空'}
      </div>
      ${clozeState.checked ? `<div class="feedback ${isOk ? 'ok' : 'err'}">
        ${isOk ? `${ICON.check} 正确！完整句子：<strong>${w.example}</strong>` : `${ICON.x} 正确答案：<strong>${w.target}</strong>`}
        <button class="icon-btn" id="czPlay" style="margin-left:auto;">${ICON.volume} 听</button>
      </div>` : ''}
      ${renderKeyboard()}
      <div class="nav-row">
        ${!clozeState.checked ? `<button class="nav-btn accent primary" id="czCheck">检查</button>` : ''}
        <button class="nav-btn" id="czNext">${clozeState.checked ? '下一题 →' : '跳过'}</button>
      </div>
    </div>
  `;

  bindKeyboard(
    (ch) => { if (!clozeState.checked) { clozeState.input += ch; render(); } },
    () => { if (!clozeState.checked) { clozeState.input += ' '; render(); } },
    () => { if (!clozeState.checked) { clozeState.input = clozeState.input.slice(0, -1); render(); } }
  );
  if (!clozeState.checked) {
    $('czCheck').onclick = () => {
      clozeState.checked = true;
      state.stats.cloze++;
      state.stats.totalCloze++;
      if (isOk) { state.stats.correctCloze++; markKnown(w.id); }
      saveState();
      render();
    };
  } else {
    $('czPlay').onclick = () => speak(w.example);
  }
  $('czNext').onclick = () => {
    idx = (idx + 1) % list.length;
    clozeState = null;
    shifted = false;
    render();
  };
}

// ---- 统计 ----
function renderStats() {
  const total = BUILTIN.length + state.custom.length;
  const knownPct = total > 0 ? Math.round(state.known.length / total * 100) : 0;
  const totalActions = state.stats.browse + state.stats.flashcard + state.stats.quiz + state.stats.spell + state.stats.cloze;
  const spellAcc = state.stats.totalSpell > 0 ? Math.round(state.stats.correctSpell / state.stats.totalSpell * 100) : 0;
  const clozeAcc = state.stats.totalCloze > 0 ? Math.round(state.stats.correctCloze / state.stats.totalCloze * 100) : 0;
  const topicStats = TOPICS.slice(1).map(t => {
    const inTopic = BUILTIN.filter(w => w.topic === t);
    const knownInTopic = inTopic.filter(w => isKnown(w.id)).length;
    return { topic: t, total: inTopic.length, known: knownInTopic };
  });

  $('content').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><p class="stat-label">总词数</p><p class="stat-value">${total}</p></div>
      <div class="stat-card"><p class="stat-label">已掌握</p><p class="stat-value">${state.known.length} <span class="stat-sub">${knownPct}%</span></p></div>
      <div class="stat-card"><p class="stat-label">拼写正确率</p><p class="stat-value">${spellAcc}<span style="font-size:14px;">%</span> <span class="stat-sub">${state.stats.correctSpell}/${state.stats.totalSpell}</span></p></div>
      <div class="stat-card"><p class="stat-label">填空正确率</p><p class="stat-value">${clozeAcc}<span style="font-size:14px;">%</span> <span class="stat-sub">${state.stats.correctCloze}/${state.stats.totalCloze}</span></p></div>
    </div>

    <div class="card" style="margin-bottom:10px;">
      <p style="font-size:12px;font-weight:500;margin:0 0 12px;letter-spacing:0.05em;">各主题掌握进度</p>
      ${topicStats.map(s => `<div class="topic-bar">
        <div class="lbl"><span>${s.topic}</span><span>${s.known} / ${s.total}</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${s.total > 0 ? s.known / s.total * 100 : 0}%;"></div></div>
      </div>`).join('')}
    </div>

    <div class="card" style="margin-bottom:10px;">
      <p style="font-size:12px;font-weight:500;margin:0 0 10px;letter-spacing:0.05em;">练习次数（累计 ${totalActions}）</p>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;">
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.browse}</p><p class="stat-label" style="margin-top:2px;">浏览</p></div>
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.flashcard}</p><p class="stat-label" style="margin-top:2px;">认词</p></div>
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.quiz}</p><p class="stat-label" style="margin-top:2px;">选择</p></div>
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.spell}</p><p class="stat-label" style="margin-top:2px;">拼写</p></div>
        <div><p style="font-family:var(--serif);font-size:20px;margin:0;font-weight:500;">${state.stats.cloze}</p><p class="stat-label" style="margin-top:2px;">填空</p></div>
      </div>
    </div>

    <button class="nav-btn" id="resetBtn" style="width:100%;color:var(--err);">重置所有进度</button>
  `;
  $('resetBtn').onclick = () => {
    if (confirm('确认要清除所有学习进度吗？自定义单词不会被删除。')) {
      state.known = [];
      state.stats = { browse: 0, flashcard: 0, quiz: 0, spell: 0, cloze: 0, correctSpell: 0, totalSpell: 0, correctCloze: 0, totalCloze: 0 };
      saveState();
      render();
    }
  };
}

// ---- 添加 ----
function renderAdd() {
  $('content').innerHTML = `
    <div class="card">
      <p style="font-size:14px;font-weight:500;margin:0 0 12px;">添加新单词</p>
      <div class="form-row"><label class="form-label">俄语 *</label><input id="inRu" placeholder="例如：книга"></div>
      <div class="form-row"><label class="form-label">带重音（可选，重音字母后加 ́ ）</label><input id="inStress" placeholder="例如：кни́га"></div>
      <div class="form-row"><label class="form-label">中文 *</label><input id="inCn" placeholder="例如：书"></div>
      <div class="form-row"><label class="form-label">词性</label><input id="inPos" placeholder="例如：阴性名词"></div>
      <div class="form-row"><label class="form-label">例句</label><input id="inEx" placeholder="例如：Это новая книга."></div>
      <div class="form-row"><label class="form-label">例句中文</label><input id="inExCn" placeholder="例如：这是一本新书。"></div>
      <div class="form-row"><label class="form-label">备注</label><input id="inNote" placeholder="变格、用法等"></div>
      <div class="nav-row">
        <button class="nav-btn success primary" id="saveBtn">${ICON.check} 保存</button>
        <button class="nav-btn" id="clearBtn">清空</button>
      </div>
      <p id="addMsg" style="font-size:11px;margin:10px 0 0;min-height:14px;"></p>
    </div>
  `;
  $('saveBtn').onclick = () => {
    const ru = $('inRu').value.trim();
    const cn = $('inCn').value.trim();
    if (!ru || !cn) {
      $('addMsg').style.color = 'var(--err)';
      $('addMsg').textContent = '请填写俄语和中文';
      return;
    }
    state.custom.push({
      id: 'c' + Date.now(),
      topic: '我添加的',
      ru,
      stress: $('inStress').value.trim() || ru,
      cn,
      pos: $('inPos').value.trim() || '自定义',
      example: $('inEx').value.trim(),
      exampleCn: $('inExCn').value.trim(),
      target: ru,
      note: $('inNote').value.trim(),
      custom: true
    });
    saveState();
    $('addMsg').style.color = 'var(--ok)';
    $('addMsg').textContent = '✓ 已添加';
    ['inRu','inStress','inCn','inPos','inEx','inExCn','inNote'].forEach(id => $(id).value = '');
    updateFooter();
  };
  $('clearBtn').onclick = () => {
    ['inRu','inStress','inCn','inPos','inEx','inExCn','inNote'].forEach(id => $(id).value = '');
    $('addMsg').textContent = '';
  };
}

// ---- 我的词 ----
function renderMyList() {
  if (state.custom.length === 0) {
    $('content').innerHTML = `<div class="card" style="text-align:center;padding:30px 20px;">
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px;">还没添加单词</p>
      <button class="nav-btn" id="gotoAdd" style="display:inline-block;padding:8px 16px;">＋ 去添加</button>
    </div>`;
    $('gotoAdd').onclick = () => switchMode('add');
    return;
  }
  $('content').innerHTML = `<div class="card">
    <p style="font-size:12px;color:var(--ink-soft);margin:0 0 10px;">共 ${state.custom.length} 个自定义</p>
    ${state.custom.map(w => `<div class="list-item">
      <div class="info">
        <p class="ru">${w.stress}</p>
        <p class="cn-small">${w.cn}</p>
      </div>
      <button class="small-btn" data-sp="${w.ru}">${ICON.volume}</button>
      <button class="small-btn danger" data-del="${w.id}">${ICON.trash}</button>
    </div>`).join('')}
  </div>`;
  document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => speak(b.dataset.sp));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    state.custom = state.custom.filter(x => x.id !== b.dataset.del);
    saveState();
    render();
  });
}

function render() {
  renderTabs();
  renderTopics();
  $('progressBar').style.display = ['stats','add','mylist'].indexOf(mode) >= 0 ? 'none' : 'block';
  updateFooter();
  switch(mode) {
    case 'browse': renderBrowse(); break;
    case 'flashcard': renderFlashcard(); break;
    case 'quiz': renderQuiz(); break;
    case 'spell': renderSpell(); break;
    case 'cloze': renderCloze(); break;
    case 'stats': renderStats(); break;
    case 'add': renderAdd(); break;
    case 'mylist': renderMyList(); break;
  }
}
function switchMode(m) {
  mode = m;
  flashRevealed = false;
  quizState = spellState = clozeState = null;
  shifted = false;
  render();
}

// 启动
loadState();
render();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
